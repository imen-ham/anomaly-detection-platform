version: '3.9'
services:
  postgres:
    image: postgres:15
    container_name: anomaly-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: anomaly_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: anomaly-backend
    environment:
      DATABASE_URL: postgresql+pg8000://admin:admin123@postgres:5432/anomaly_db
      SECRET_KEY: supersecretkey123
      CORS_ORIGINS: http://localhost:5174
    ports:
      - "8001:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    container_name: anomaly-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      VITE_API_BASE_URL: http://localhost:8001/api
      VITE_BACKEND_TARGET: http://backend:8000
    ports:
      - "5174:5174"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

  prometheus:
    image: prom/prometheus:latest
    container_name: anomaly-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: anomaly-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_SECURITY_ADMIN_USER: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana-data: