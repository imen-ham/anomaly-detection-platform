version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: anomaly-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: anomaly_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: anomaly-backend
    environment:
      DATABASE_URL: postgresql+pg8000://admin:admin123@postgres:5432/anomaly_db
      SECRET_KEY: supersecretkey123
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

volumes:
  pgdata: